function chooseQuestions(){let out=[];for(let i=0;i<3;i++)out.push(...shuffle(BANKS[i]).slice(0,[8,8,4][i]).map(q=>({...q,section:i})));return out}
function trainingQuestion(){let pool=BANKS.flatMap((b,i)=>b.map((q,j)=>({...q,section:i,key:i+'-'+j})));let candidates=pool.filter(q=>!state.seen.has(q.key));if(!candidates.length){state.seen.clear();candidates=pool}let q=candidates[Math.floor(Math.random()*candidates.length)];state.seen.add(q.key);return q}
function start(mode){clearClocks();state.mode=mode;state.screen='question';state.questions=mode==='training'?[]:chooseQuestions();state.index=0;state.score=0;state.streak=0;state.seen=new Set();state.cheated=false;state.finishSent=false;state.correct=0;state.wrong=0;try{if(mode!=='training')sessionStorage.setItem('privlastky_active_attempt','1')}catch(e){}next()}
function next(){clearClocks();if(state.mode!=='training'&&state.index>=20){finish();return}state.current=state.mode==='training'?trainingQuestion():state.questions[state.index];state.selected=new Set();state.type='';state.locked=false;state.screen='question';renderQuestion();if(state.mode!=='training'){state.deadline=Date.now()+30000;state.timer=setInterval(()=>{let remain=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));let el=document.getElementById('time');if(el)el.textContent=remain;if(Date.now()>=state.deadline){clearInterval(state.timer);if(!state.locked)answer(true)}},100)}}
function renderQuestion(){let q=state.current;let words=q.text.split(/\s+/);let buttons=words.map((w,i)=>`<button class="word ${state.selected.has(i)?'sel':''}" data-word="${i}" onclick="toggleWord(${i})">${esc(w)}</button>`).join(' ');let kinds=TYPES[q.section].map(t=>`<button class="type ${state.type===t?'sel':''}" data-kind="${esc(t)}" onclick="chooseType(this)">${esc(t.toUpperCase())}</button>`).join('');let caption=q.section===0?'Označ celý přívlastek (u předložkového spojení včetně předložky) a urči jeho druh.':q.section===1?'Označ pouze slova ve funkci přívlastku a urči jeho druh.':'Označ celou přívlastkovou konstrukci a rozhodni, zda je těsná, nebo volná. Interpunkce záměrně chybí.';draw(`<div class="card"><div class="topbar"><div class="seal ${state.mode==='test'?'testSeal':state.mode==='challenge'?'challengeSeal':'sectionSeal'}">${state.mode==='test'?'TEST':state.mode==='challenge'?'VÝZVA':'TRÉNINK'}</div><div class="timeCenter"><span id="time">${state.mode==='training'?'∞':'30'}</span><span class="status">${state.mode==='training'?'ÚLOHA '+(state.index+1):'ÚLOHA '+(state.index+1)+'/20'} • ${state.mode==='challenge'?'SÉRIE '+state.streak:state.mode==='test'?'BODY '+state.score:'PROCVIČOVÁNÍ'}</span></div><div class="seal sectionSeal">${SECTIONS[q.section]}</div></div><div class="prompt">${caption}</div><div class="question words" id="words">${buttons}</div><div class="types" id="types">${kinds}</div><p class="help">U možnosti BEZ PŘÍVLASTKU neoznačuj žádné slovo.</p><div class="row"><button class="btn challengeBtn" id="done" onclick="answer(false)">HOTOVO</button></div><div class="feedback" id="fb"></div><div class="row" id="nextRow"></div>${state.mode==='training'?'<div class="row"><button class="btn ghost" onclick="home()">HLAVNÍ MENU</button></div>':''}</div>`)}
function toggleWord(i){if(state.locked)return;state.selected.has(i)?state.selected.delete(i):state.selected.add(i);document.querySelector(`[data-word="${i}"]`).classList.toggle('sel',state.selected.has(i))}
function chooseType(el){if(state.locked)return;state.type=el.dataset.kind;document.querySelectorAll('.type').forEach(x=>x.classList.toggle('sel',x===el))}
function same(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function answer(expired){if(state.locked)return;if(!expired&&!state.type){alert('Nejdříve vyber druh přívlastku.');return}state.locked=true;clearInterval(state.timer);let q=state.current;let good=!expired&&state.type===q.kind&&same([...state.selected],q.indices);if(state.mode!=='training'){if(good)state.correct++;else state.wrong++;}document.querySelectorAll('.word').forEach(b=>{let i=Number(b.dataset.word);b.disabled=true;if(q.indices.includes(i))b.classList.add('good');else if(state.selected.has(i))b.classList.add('badword')});document.querySelectorAll('.type').forEach(b=>{b.disabled=true;if(b.dataset.kind===q.kind)b.classList.add('sel')});document.getElementById('done').disabled=true;if(good){state.score++;state.streak++;soundCorrect()}else{state.streak=0;soundWrong()}let chosen=q.indices.map(i=>q.text.split(/\s+/)[i]).join(' ');let fb=good?'SPRÁVNĚ!':expired?'ČAS VYPRŠEL':'CHYBA';document.getElementById('fb').innerHTML=`<span class="${good?'ok':'bad'}">${fb}</span><div class="help">Správně: <b>${esc(q.kind)}</b> • ${esc(chosen||'žádné slovo')}</div>`;state.index++;let reset=state.mode==='challenge'&&!good;document.getElementById('nextRow').innerHTML=`<button class="btn ghost" id="nextBtn">${reset?'NOVÁ VÝZVA':state.mode==='training'?'DALŠÍ OTÁZKA':state.index>=20?'VÝSLEDEK':'DALŠÍ'}</button>`;document.getElementById('nextBtn').onclick=()=>{if(reset){state.questions=chooseQuestions();state.index=0;state.score=0;state.streak=0}next()};state.pending=setTimeout(()=>{let btn=document.getElementById('nextBtn');if(btn)btn.click()},good?1400:5500)}
function grade(s){return s>=18?1:s>=16?2:s>=13?3:s>=9?4:5}
function buildPayload(z,kind){return {timestamp:new Date().toISOString(),jmeno:state.name,trida:state.clazz,znamka:z,rezim:state.mode,oddil:'druhy přívlastku',body:state.score,celkem:20,spravne:state.correct,spatne:state.wrong,poznamka:kind,sheetId:SHEET_ID,app:'Lovci druhů přívlastků'}}
function sendResult(z,kind,urgent=false){
 if(state.finishSent)return;
 state.finishSent=true;
 const params=new URLSearchParams();Object.entries(buildPayload(z,kind)).forEach(([k,v])=>params.append(k,String(v??'')));
 const status=()=>document.getElementById('sendStatus');
 try{
  if(urgent&&navigator.sendBeacon){const ok=navigator.sendBeacon(GAS_WEB_APP_URL,new Blob([params.toString()],{type:'application/x-www-form-urlencoded'}));if(!ok)fetch(GAS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params.toString(),keepalive:true}).catch(()=>{});}
  else fetch(GAS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params.toString(),keepalive:true}).then(()=>{let el=status();if(el)el.textContent='Požadavek na odeslání byl předán. Zápis ověř ve výsledkové tabulce.'}).catch(()=>{let el=status();if(el)el.textContent='Odeslání se nepodařilo. Zapiš si body a známku.'});
 }catch(e){let el=status();if(el)el.textContent='Odeslání se nepodařilo. Zapiš si body a známku.';}
}
function finish(){clearClocks();state.screen='finish';try{sessionStorage.removeItem('privlastky_active_attempt')}catch(e){}let z=state.mode==='challenge'?1:grade(state.score);saveResult(z);draw(`<div class="card"><h1 class="title">${state.mode==='challenge'?'VÝZVA SPLNĚNA':'VÝSLEDEK TESTU'}</h1><div class="result"><b>${esc(state.name)}</b> • ${esc(state.clazz)}<p>Body: <b>${state.score}/20</b></p><p>Známka: <b>${z}</b></p></div><p class="small">Výsledek se odesílá do společné tabulky Google a současně ukládá v tomto prohlížeči.</p><div class="sendStatus" id="sendStatus"></div><div class="row"><button class="btn" onclick="home()">HLAVNÍ MENU</button></div></div>`);sendResult(z,state.mode==='challenge'?'VÝZVA':'TEST')}
function cheatFinish(reason){if(state.screen!=='question'||!['challenge','test'].includes(state.mode))return;clearClocks();state.screen='finish';state.locked=true;try{sessionStorage.removeItem('privlastky_active_attempt')}catch(e){}saveResult(6);sendResult(6,'PODVOD: '+reason,true);soundWrong();draw(`<div class="card cheat"><h1 class="title">PODVOD – POKUS UKONČEN</h1><div class="result">Opuštění aktivního okna (${esc(reason)}).<p>Známka: <b>6</b></p></div><div class="row"><button class="btn ghost" onclick="home()">HLAVNÍ MENU</button></div></div>`)}
let audioCtx=null;function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,dur){try{unlockAudio();if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.value=.07;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function soundCorrect(){tone(850,.12)}function soundWrong(){tone(190,.22)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')cheatFinish('přepnutí na jinou kartu nebo aplikaci')});
window.addEventListener('pagehide',()=>cheatFinish('opuštění stránky'));
// Ztráta zaměření okna (blur) sama o sobě není podvod: může vzniknout při zoomu nebo práci s prohlížečem.
let interrupted=false;try{interrupted=sessionStorage.getItem('privlastky_active_attempt')==='1';sessionStorage.removeItem('privlastky_active_attempt')}catch(e){}
home();if(interrupted){state.screen='finish';draw(`<div class="card cheat"><h1 class="title">PODVOD – POKUS PŘERUŠEN</h1><p class="result">Předchozí test nebo výzva byly opuštěny před dokončením. Známka: <b>6</b></p><div class="row"><button class="btn ghost" onclick="home()">HLAVNÍ MENU</button></div></div>`)}
</script></body></html>
